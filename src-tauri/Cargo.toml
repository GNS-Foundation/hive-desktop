[package]
name = "hive-desktop"
version = "0.4.3"
description = "GEIANT Hive — desktop identity & worker"
authors = ["GNS Foundation"]
edition = "2021"

[lib]
name = "hive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography (Ed25519 signing + hashing)
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
rand_core = { version = "0.6", features = ["std"] }
hex = "0.4"
sha2 = "0.10"

# System info (CPU, RAM, hostname)
sysinfo = "0.32"

# H3 geo cells
h3o = "0.7"

# HTTP client (rustls = no openssl headaches on macOS/Windows)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime (required by reqwest async)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Cross-platform user dirs (e.g. ~/.config on macOS/Linux, %APPDATA% on Windows)
dirs = "5"

# Error handling
anyhow = "1"
thiserror = "1"
